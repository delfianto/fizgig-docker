name: Test, Build and Publish
on:
  schedule:
    # 02:43 WIB (UTC+7); avoid the start-of-hour queue.
    - cron: '43 19 * * *'
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Upstream runtime base; defaults to ghcr.io/shootthesound/fizgig:latest, resolved to a digest'
        required: false
        type: string
      upstream_commit:
        description: 'Optional full upstream commit SHA; defaults to upstream HEAD'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: fizgig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      needs_build: ${{ steps.upstream.outputs.needs_build }}
      upstream_commit: ${{ steps.upstream.outputs.upstream_commit }}
      base_image: ${{ steps.upstream.outputs.base_image }}
      base_digest: ${{ steps.upstream.outputs.base_digest }}
      build_tag: ${{ steps.upstream.outputs.build_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'schedule'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve upstream HEAD and check the published build fingerprint
        id: upstream
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          INPUT_BASE: ${{ inputs.base_image }}
          INPUT_COMMIT: ${{ inputs.upstream_commit }}
        run: |
          python3 mcp/tools/upstream/check.py \
            --image "ghcr.io/${IMAGE_OWNER,,}/fizgig" \
            --base-image "${INPUT_BASE:-ghcr.io/shootthesound/fizgig:latest}" \
            --upstream-commit "$INPUT_COMMIT"
      - name: Report nightly decision
        env:
          NEEDS_BUILD: ${{ steps.upstream.outputs.needs_build }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.upstream_commit }}
          BASE_IMAGE: ${{ steps.upstream.outputs.base_image }}
        run: |
          {
            echo "### Upstream check"
            echo "- Commit: \`$UPSTREAM_COMMIT\`"
            echo "- Base: \`$BASE_IMAGE\`"
            echo "- Build required: $NEEDS_BUILD"
          } >> "$GITHUB_STEP_SUMMARY"
  test:
    needs: resolve
    if: needs.resolve.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra mcp
      - run: uv run --locked --extra mcp python -m unittest discover -s tests -v
  image:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free runner space for the upstream CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker image prune -af
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fizgig
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.resolve.outputs.build_tag }}
            type=sha
            type=semver,pattern={{version}}
          labels: |
            io.github.delfianto.fizgig.upstream-revision=${{ needs.resolve.outputs.upstream_commit }}
            io.github.delfianto.fizgig.base-digest=${{ needs.resolve.outputs.base_digest }}
      - name: Build; publish only for trusted branch/tag/dispatch events
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.resolve.outputs.base_image }}
            UPSTREAM_COMMIT=${{ needs.resolve.outputs.upstream_commit }}
